
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Parking | ParkShare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">🅿 Park<span>Share</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a class="active" href="find-parking.html">Find Parking</a>
      <a href="host.html">Become a Host</a>
      <a href="about.html">About Us</a>
    </nav>
    <div class="nav-actions" id="navActions">
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="signup.html" class="btn btn-primary">Sign Up</a>
    </div>
  </header>

  <section class="page-banner">
    <div class="container">
      <span class="eyebrow">EXPLORE PARKING</span>
      <h1>Find Your Parking Space</h1>
      <p>Discover convenient parking spaces near your destination.</p>
    </div>
  </section>

  <main class="section container">
    <div class="search-panel">
      <div class="search-grid">
        <div class="field">
          <label for="searchCity">Location</label>
          <input id="searchCity" placeholder="Enter city or area">
        </div>
        <div class="field">
          <label for="vehicleFilter">Vehicle Type</label>
          <select id="vehicleFilter">
            <option value="">All Vehicles</option>
            <option value="Car">Car</option>
            <option value="Bike">Bike</option>
          </select>
        </div>
        <div class="field">
          <label for="priceFilter">Maximum Hourly Price</label>
          <select id="priceFilter">
            <option value="">Any Price</option>
            <option value="30">₹30</option>
            <option value="50">₹50</option>
            <option value="100">₹100</option>
            <option value="200">₹200</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="renderParking()">Search Parking</button>
      </div>
      <button class="btn btn-outline" onclick="findNearby()">📍 Find Near Me</button>
    </div>

    <div class="results-heading">
      <h2>Available Parking Spaces</h2>
      <span id="resultCount" class="muted"></span>
    </div>

    <div id="parkingResults" class="parking-grid"></div>
  </main>

  <footer class="footer">
    <p>© 2026 ParkShare. All rights reserved.</p>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
