
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | ParkShare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-side">
      <a href="index.html" class="logo logo-white">🅿 ParkShare</a>
      <div>
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Your Parking Journey Starts Here.</h1>
        <p>Find spaces, manage listings and enjoy a simpler parking experience.</p>
        <div class="auth-art">🚗</div>
      </div>
      <p>© 2026 ParkShare</p>
    </div>

    <div class="auth-content">
      <a href="index.html" class="back-link">← Back to Home</a>
      <form id="loginForm" class="auth-form">
        <h2>Welcome Back!</h2>
        <p class="muted">Enter your details to sign in.</p>

        <label for="loginEmail">Email Address</label>
        <input id="loginEmail" type="email" placeholder="you@example.com" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Enter your password" required>

        <button type="submit" class="btn btn-primary btn-full">Sign In →</button>
        <p id="loginMessage" class="form-message"></p>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Create Account</a></p>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
