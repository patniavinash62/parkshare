
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | ParkShare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-side">
      <a href="index.html" class="logo logo-white">🅿 ParkShare</a>
      <div>
        <span class="eyebrow">JOIN PARKSHARE</span>
        <h1>Smarter Parking Begins With You.</h1>
        <p>Create an account to find parking or share your own parking space.</p>
        <div class="auth-art">🅿️</div>
      </div>
      <p>© 2026 ParkShare</p>
    </div>

    <div class="auth-content">
      <a href="index.html" class="back-link">← Back to Home</a>
      <form id="signupForm" class="auth-form">
        <h2>Create Your Account</h2>
        <p class="muted">Join ParkShare and get started today.</p>

        <label for="signupName">Full Name</label>
        <input id="signupName" required placeholder="Enter full name">

        <label for="signupEmail">Email Address</label>
        <input id="signupEmail" type="email" required placeholder="you@example.com">

        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" minlength="8" required placeholder="Minimum 8 characters">

        <label for="signupConfirm">Confirm Password</label>
        <input id="signupConfirm" type="password" required placeholder="Confirm password">

        <label for="signupRole">Account Type</label>
        <select id="signupRole">
          <option value="user">Driver / Parking User</option>
          <option value="host">Parking Space Host</option>
        </select>

        <button type="submit" class="btn btn-primary btn-full">Create Account →</button>
        <p id="signupMessage" class="form-message"></p>

        <p class="auth-switch">Already have an account? <a href="login.html">Sign In</a></p>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
